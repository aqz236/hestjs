name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 仅在主仓执行，避免 fork 触发发布
    if: github.repository == 'aqz236/hestjs'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          # 注入守卫：未配置 NPM_TOKEN 时只维护版本 PR，不做发布，
          # 避免仓库在接入 npm 凭据前每次推送都失败。
          publish: |
            if [ -z "$NPM_TOKEN" ]; then
              echo "::notice::NPM_TOKEN \u672a\u914d\u7f6e\uff0c\u8df3\u8fc7 npm \u53d1\u5e03"
              exit 0
            fi
            bun run release
          commit: "chore(release): 发布新版本"
          title: "chore(release): 发布新版本"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
